org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Placeholder-driven build config -----------------------------------
# These are injected by the backend before every CI build. They are the
# single source of truth for per-app identity. Do NOT hardcode app
# identity anywhere else (manifest, gradle, or Kotlin) -- everything
# reads from here via BuildConfig / manifest placeholders / resValue.
APP_NAME={{APP_NAME}}
PACKAGE_NAME={{PACKAGE_NAME}}
VERSION_NAME={{VERSION_NAME}}
VERSION_CODE={{VERSION_CODE}}
START_URL={{START_URL}}
THEME_COLOR={{THEME_COLOR}}
SPLASH_ENABLED={{SPLASH_ENABLED}}
PERMISSION_CAMERA={{PERMISSION_CAMERA}}
PERMISSION_LOCATION={{PERMISSION_LOCATION}}
PERMISSION_STORAGE={{PERMISSION_STORAGE}}
LICENSE_KEY={{LICENSE_KEY}}
API_BASE={{API_BASE}}
